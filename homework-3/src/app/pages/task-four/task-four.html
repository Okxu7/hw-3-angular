  <h3>Завдання 4: Плавне зникнення перед видаленням з DOM</h3>

@if (isElementInDom()) {
  <!-- Додаємо динамічний клас [class.fade-out], коли isHiding стає true -->
  <div 
    class="deletable-box" 
    [class.fade-out]="isHiding()" 
    (click)="removeItem()">
    Натисни на мене, і я плавно зникну перед видаленням з DOM!
  </div>
} @else {
  <button (click)="restoreItem()" class="restore-btn">
    Повернути елемент у DOM
  </button>
}
